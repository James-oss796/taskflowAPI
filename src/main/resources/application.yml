spring:
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
    username: ${DB_USER:taskflow}
    password: ${DB_PASSWORD:taskflow}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.hibernate.SQL: debug
  pattern:
    level: "%5p [%X{requestId:-}]"


app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: taskflow-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d